name: CI
on: push  # every branch; a pull request shows the checks of its latest push

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:  # throwaway database for test_app.py; never touches Supabase
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # test_eval_ocr.py is left out: it needs the datasets and OCR models in data/
      - run: python test_validate.py
      - run: python test_extract.py
      - run: python test_app.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:  # placeholders: the build only needs the variables to exist
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
